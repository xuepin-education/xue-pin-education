<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XP Education | 学品补习学院</title>
    <meta name="description" content="XP Education bilingual tuition centre website for primary, secondary, SPM, daycare, awards, branches, and trial lesson booking.">
    <link rel="stylesheet" href="assets/styles.css?v=20260822-2">
  </head>
  <body data-page="home">
    <header class="site-header landing-header">
      <a class="brand-mark" href="index.html" data-brand-home></a>
      <nav class="main-nav" data-nav data-home-nav></nav>
      <div class="header-actions">
        <button class="language-toggle" type="button" data-lang-toggle>EN</button>
      </div>
    </header>

    <main>
      <section class="hero-section" id="home">
        <div class="hero-copy">
          <p class="hero-theme" data-i18n="home.hero.theme"></p>
          <h1 data-i18n="home.hero.title"></h1>
          <p class="hero-position" data-i18n="home.hero.position"></p>
          <p class="hero-lede" data-i18n="home.hero.lede"></p>
          <div class="hero-actions">
            <a class="btn btn-secondary" href="#courses" data-i18n="cta.courses"></a>
          </div>
        </div>
        <aside class="hero-emblem" aria-label="XP Education logo and exam research experience">
          <div class="hero-logo-frame">
            <img data-hero-logo alt="">
          </div>
          <p class="hero-research" data-i18n="home.hero.research"></p>
        </aside>
        <dl class="hero-stats" data-stats></dl>
      </section>

      <section class="trust-showcase" id="trust">
        <div class="trust-heading" data-text-reveal>
          <p class="eyebrow" data-i18n="home.trust.eyebrow"></p>
          <h2 class="trust-reveal-title" data-i18n="home.trust.title"></h2>
          <p data-i18n="home.trust.lede"></p>
        </div>
        <div class="trust-spotlight">
          <article class="trust-trophy-story" data-trust-trophy></article>
          <div class="trust-carousel" data-trust-carousel aria-roledescription="carousel"></div>
        </div>
        <div class="trust-awards" data-trust-awards></div>
      </section>

      <section class="section-wrap promise-showcase" id="promise">
        <div class="promise-spotlight">
          <article class="promise-story">
            <div class="promise-story-copy">
              <span class="promise-story-kicker" data-i18n="home.promise.storyKicker"></span>
              <h2 data-i18n="home.promise.storyTitle"></h2>
            </div>
          </article>
          <figure class="promise-poster">
            <img data-promise-poster alt="">
          </figure>
        </div>
      </section>

      <section class="section-band process-section student-progress-section" id="process">
        <div class="section-heading student-progress-heading">
          <h2 class="sr-only" data-i18n="home.process.title"></h2>
          <div class="progress-marquee" data-progress-marquee aria-hidden="true">
            <div class="progress-marquee-row progress-marquee-primary">
              <div class="progress-marquee-track" data-progress-marquee-track="primary"></div>
            </div>
            <div class="progress-marquee-row progress-marquee-outline">
              <div class="progress-marquee-track" data-progress-marquee-track="outline"></div>
            </div>
          </div>
        </div>
        <div class="student-progress-grid" data-student-progress></div>
        <section class="instagram-reels-showcase" aria-labelledby="instagram-reels-title">
          <div class="instagram-reels-heading">
            <p class="eyebrow">INSTAGRAM REELS</p>
            <h3 id="instagram-reels-title" data-instagram-reels-title></h3>
          </div>
          <div class="instagram-reels-grid" data-instagram-reels></div>
        </section>
      </section>

      <section class="section-wrap course-roadmap" id="courses">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="home.courses.eyebrow"></p>
          <h2 data-i18n="home.courses.title"></h2>
        </div>
        <nav class="course-stage-nav" data-course-navigation aria-label="课程年级"></nav>
        <div class="course-detail-list" data-course-details></div>
      </section>

      <section class="section-band daycare-showcase" id="daycare">
        <article class="daycare-copy">
          <p class="eyebrow" data-i18n="coursesPage.daycare.eyebrow"></p>
          <h2 data-i18n="coursesPage.daycare.title"></h2>
          <p class="daycare-slogan" data-daycare-slogan></p>
          <p class="daycare-lede" data-i18n="coursesPage.daycare.lede"></p>
        </article>
        <div class="daycare-carousel" data-daycare-carousel aria-roledescription="carousel"></div>
      </section>

      <section class="section-band" id="teachers">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="teachersPage.eyebrow"></p>
          <h2 data-i18n="teachersPage.title"></h2>
          <p data-i18n="teachersPage.lede"></p>
        </div>
        <nav class="teacher-tabs" data-teacher-tabs aria-label="老师团队组别"></nav>
        <div class="teacher-grid" data-teachers></div>
      </section>

      <section class="section-band split-section" id="reviews">
        <div class="review-heading">
          <p class="eyebrow" data-i18n="storiesPage.reviews.eyebrow"></p>
          <h2 data-i18n="storiesPage.reviews.title"></h2>
          <p class="review-lede" data-i18n="storiesPage.reviews.lede"></p>
        </div>
        <div class="review-content">
          <figure class="review-poster">
            <img data-review-poster alt="">
          </figure>
          <div class="review-grid" data-reviews></div>
        </div>
      </section>

      <section class="section-wrap contact-panel" id="contact">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="contactPage.eyebrow"></p>
          <h2 data-i18n="contactPage.title"></h2>
          <p data-i18n="contactPage.lede"></p>
        </div>
        <div class="branch-grid" data-branches></div>
      </section>
    </main>

    <footer class="site-footer" data-footer></footer>
    <script src="assets/site-data.js?v=20260827-1"></script>
    <script src="assets/app.js?v=20260821-5"></script>
  </body>
</html>
